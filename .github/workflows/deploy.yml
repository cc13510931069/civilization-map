# 自动部署到 GitHub Pages
# 每次推送到 main 分支时，自动构建 Flutter Web 并发布
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build web
        shell: bash
        run: |
          FLAGS="--release --base-href=/civilization-map/"
          if [ -n "${{ secrets.VEGGIE_API_URL }}" ]; then
            FLAGS="$FLAGS --dart-define=VEGGIE_API_URL=${{ secrets.VEGGIE_API_URL }}"
            echo "✅ AI API URL configured: ${{ secrets.VEGGIE_API_URL }}"
          else
            echo "ℹ️  VEGGIE_API_URL 未设置，使用本地模拟 AI"
          fi
          flutter build web $FLAGS

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
